<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Food Ordering System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #ff5722;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        nav {
            background: #333;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 15px;
        }

        h2 {
            margin-bottom: 20px;
            color: #ff5722;
        }

        .food-menu {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(220px, 1fr)
            );
            gap: 20px;
        }

        .food-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px #ddd;
            text-align: center;
            padding-bottom: 20px;
        }

        .food-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .food-card h3 {
            margin: 12px;
        }

        .food-card p {
            margin: 10px;
        }

        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #e64a19;
        }

        .cart, .checkout {
            background: white;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .quantity button {
            padding: 5px 10px;
            margin: 0 3px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .checkout input,
        .checkout textarea {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .checkout textarea {
            resize: vertical;
            min-height: 80px;
        }

        #message {
            margin-top: 15px;
            color: green;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: #333;
            color: white;
        }

        @media (max-width: 500px) {
            nav a {
                display: inline-block;
                margin: 6px;
            }

            .cart-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Foodie Express</h1>
    <p>Delicious food delivered to your doorstep!</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#menu">Food Menu</a>
    <a href="#cart">My Cart</a>
    <a href="#checkout">Checkout</a>
</nav>

<div class="container" id="home">

    <section id="menu">
        <h2>Our Food Menu</h2>
        <div class="food-menu" id="foodMenu"></div>
    </section>

    <section class="cart" id="cart">
        <h2>Shopping Cart</h2>
        <div id="cartItems">Your cart is empty.</div>
        <p class="total">
            Total: ₹<span id="total">0.00</span>
        </p>
    </section>

    <section class="checkout" id="checkout">
        <h2>Customer Details</h2>

        <form id="orderForm">
            <input
                type="text"
                id="customerName"
                placeholder="Enter your full name"
                required
            >

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

            <textarea
                id="address"
                placeholder="Enter delivery address"
                required
            ></textarea>

            <button type="submit">Place Order</button>
        </form>

        <p id="message" role="status"></p>
    </section>

</div>

<footer>
    <p>© 2026 Foodie Express | Online Food Ordering System</p>
</footer>

<script>
    const foods = [
        {
            id: 1,
            name: "Veg Pizza",
            price: 199,
            image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500"
        },
        {
            id: 2,
            name: "Burger",
            price: 129,
            image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"
        },
        {
            id: 3,
            name: "Biryani",
            price: 249,
            image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?w=500"
        },
        {
            id: 4,
            name: "Pasta",
            price: 179,
            image: "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=500"
        },
        {
            id: 5,
            name: "French Fries",
            price: 99,
            image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500"
        },
        {
            id: 6,
            name: "Sandwich",
            price: 119,
            image: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500"
        }
    ];

    const cart = {};

    const foodMenu = document.getElementById("foodMenu");
    const cartItems = document.getElementById("cartItems");
    const totalElement = document.getElementById("total");
    const orderForm = document.getElementById("orderForm");
    const message = document.getElementById("message");

    // Display food menu
    function displayFoods() {
        foodMenu.innerHTML = "";

        foods.forEach(food => {
            const card = document.createElement("div");
            card.className = "food-card";

            const img = document.createElement("img");
            img.src = food.image;
            img.alt = food.name;
            img.loading = "lazy";

            const name = document.createElement("h3");
            name.textContent = food.name;

            const price = document.createElement("p");
            price.textContent = "Price: ₹" + food.price;

            const button = document.createElement("button");
            button.textContent = "Add to Cart";
            button.addEventListener("click", () => addToCart(food.id));

            card.append(img, name, price, button);
            foodMenu.appendChild(card);
        });
    }

    // Add food to cart
    function addToCart(id) {
        if (cart[id]) {
            cart[id]++;
        } else {
            cart[id] = 1;
        }

        message.textContent = "";
        displayCart();
    }

    // Change quantity
    function changeQuantity(id, change) {
        if (!cart[id]) return;

        cart[id] += change;

        if (cart[id] <= 0) {
            delete cart[id];
        }

        message.textContent = "";
        displayCart();
    }

    // Calculate cart total
    function getTotal() {
        return foods.reduce((sum, food) => {
            return sum + food.price * (cart[food.id] || 0);
        }, 0);
    }

    // Display shopping cart
    function displayCart() {
        cartItems.innerHTML = "";
        const ids = Object.keys(cart);

        if (ids.length === 0) {
            cartItems.textContent = "Your cart is empty.";
        } else {
            ids.forEach(id => {
                const food = foods.find(
                    item => item.id === Number(id)
                );

                if (!food) return;

                const item = document.createElement("div");
                item.className = "cart-item";

                const name = document.createElement("span");
                name.textContent =
                    food.name + " - ₹" + food.price;

                const quantity = document.createElement("div");
                quantity.className = "quantity";

                const minus = document.createElement("button");
                minus.textContent = "-";
                minus.setAttribute(
                    "aria-label", "Decrease " + food.name
                );
                minus.addEventListener("click", () => {
                    changeQuantity(food.id, -1);
                });

                const count = document.createElement("span");
                count.textContent = " " + cart[id] + " ";

                const plus = document.createElement("button");
                plus.textContent = "+";
                plus.setAttribute(
                    "aria-label", "Increase " + food.name
                );
                plus.addEventListener("click", () => {
                    changeQuantity(food.id, 1);
                });

                quantity.append(minus, count, plus);
                item.append(name, quantity);
                cartItems.appendChild(item);
            });
        }

        totalElement.textContent = getTotal().toFixed(2);
    }

    // Place order
    orderForm.addEventListener("submit", function(event) {
        event.preventDefault();

        if (Object.keys(cart).length === 0) {
            message.style.color = "red";
            message.textContent =
                "Please add at least one food item to your cart.";
            return;
        }

        const name = document.getElementById(
            "customerName"
        ).value.trim();

        const phone = document.getElementById(
            "phone"
        ).value.trim();

        const address = document.getElementById(
            "address"
        ).value.trim();

        if (!name || !phone || !address) {
            message.style.color = "red";
            message.textContent =
                "Please complete all customer details.";
            return;
        }

        const orderNumber = Math.floor(
            100000 + Math.random() * 900000
        );

        message.style.color = "green";
        message.textContent =
            "Thank you, " + name +
            "! Demo order #" + orderNumber +
            " placed successfully. Total: ₹" +
            getTotal().toFixed(2) + ".";

        // Reset cart after demo order
        Object.keys(cart).forEach(id => delete cart[id]);
        displayCart();
        orderForm.reset();
    });

    displayFoods();
    displayCart();
</script>

</body>
</html>
